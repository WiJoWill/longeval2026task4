# The fields below are mandatory, you can add additional metadata if you like.
# There are two libraries that automate and simplify tracking of experimental metadata that you can use optionally:
#
#   - The metadata module of [repro_eval](https://www.ir-metadata.org/software/):
#     Tracks the platform and implementation of your experiments.
#
#   - The [tirex_tracker](https://github.com/tira-io/tirex-tracker/):
#     Tracks the platform, implementation, and resources (e.g., CPU, GPU, RAM, emissions, etc.) of your experiments.
#
# See https://www.ir-metadata.org for more details.

tag: semantic_minilm_openai_llm_v1

actor:
  # The name of the team
  team: glhf

# Please provide a short description of your system.
research goal:
  description: |
    MiniLM semantic retrieval run for CLEF LongEval 2026 Task 4.
    MiniLM-style semantic relevance is used to select candidate-constrained evidence before
    OpenAI GPT-5.4 answer generation.

platform:
  software:
    # Which software and tools did you use for training, tunning and running your system?
    # You can maintain the software that you used manually.
    # Alternatively, you can use repro_eval or the tirex_tracker to track this.
    libraries:
      - python==3.11.9
      - pyyaml==6.0.3
      - openai==2.32.0
      - sentence-transformers>=2.7
      - torch>=2.0
      - task4_rag

implementation:
  source:
    # Please provide a reference to your code if possible.
    # If you can not share your code, you can delete the implementation section.
    # The repro_eval and/or tirex_tracker tools can track this automatically, including commits, branches, etc.
    repository: https://github.com/WiJoWill/longeval2026task4/tree/main/task4_rag

data:
  # Please describe which training data your system used, e.g., longeval-sci-2026, longeval-web, MS MARCO, etc.
  training data:
    - name: longeval-sci-2026
    - name: LongEval 2026 Task 4 candidate document set

method:
  # Boolean value indicating if it is a automatic (true) or manual (false) run
  automatic: true

  retrieval:
    - # Which ranking approach do you use? E.g., bm25
      name: minilm_semantic_candidate_evidence_ranking

      # How many documents/chunks did you used in generation? Please put a number here, e.g., 10 or 1000
      documents: 10

      ##################################################
      # Yes/No Questions
      ##################################################

      # Did you use any document chunking? (please enter: true/false)
      chunking: true

      # Did you retrieve/re-rank chunks? (please enter: true/false)
      chunk_ranking: true

      # Did you use more than a single retrieval/ranking model? (please enter: true/false)
      single_stage_retrieval: true

  generation:
    # Please provide a short description of your generation approach.
    description: |
      OpenAI GPT-5.4 generates evidence-grounded scientific answers from the selected
      candidate evidence passages. The prompt restricts the model to the supplied evidence
      and requires short answer sentences with citation indices into the references list.

    # Please provide a prompt use to generate answer.
    prompt: |
      Use only the supplied scientific evidence. Answer the narrative with short factual
      sentences. Each answer sentence must be supported by citation indices into the provided
      references. Prefer concise scientific wording and return valid JSON with answer text
      and citations only.

    # Which LLM did you use in generation?
    llm: OpenAI GPT-5.4

    ##################################################
    # Yes/No Questions
    ##################################################

    # Did you use any reasoning? (please enter: true/false)
    reasoning: true

    # Did you use any agentic approach? (please enter: true/false)
    agents: false
