data:
  queries_path: data/task4_longeval_rag-query_docids.jsonl
  candidates_path:
  documents_path: data/snapshot3/longeval_sci_test-09-11_2026_fulltext/documents
  citation_graph_path: data/longeval-sci-2026-citation-network.csv
  doc_text_fields: fullText|abstract|title
  candidate_limit:
  max_queries:

run:
  team_id: our_team
  run_id: topic_shift_minilm_sentence_rerank_v1
  type: automatic
  mode: hybrid_evidence_rag_v1

preprocess:
  chunk_mode: topic_shift
  passage_max_words: 140
  passage_stride_sentences: 1
  semantic_chunk_model:
  semantic_merge_threshold: 0.72
  topic_shift_model: sentence-transformers/all-MiniLM-L6-v2
  topic_shift_boundary_threshold: 0.18
  min_sentences_per_chunk: 1
  max_sentences_per_chunk:

retrieval:
  method: rrf
  top_k_passages: 10
  preselect_k: 24
  per_doc_limit: 2
  rrf_k: 60
  enable_query_expansion: true
  enable_prf: true
  prf_top_passages: 4
  query_variant_limit: 5
  rerank_top_n: 24
  enable_rerank: true
  title_boost: 0.15
  temporal_boost: 0.10
  citation_graph_boost: 0.05
  hybrid_alpha: 0.25
  dense_model:
  reranker_model:

generation:
  provider: none
  model:
  temperature: 0.0
  max_answer_sentences: 5
  temporal_templates: true
  sentence_rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  sentence_rerank_top_n: 24
  prompts_dir: task4_rag/prompts
